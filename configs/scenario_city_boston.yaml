# Research-path demo: Boston Seaport synthetic mobility + dual-band channel.
city:
  name: Boston
  preset: boston_seaport

radio:
  enabled_bands_ghz: [28.0, 39.0]
  beam_mode: codebook

scale:
  max_vehicles: 30
  max_base_stations: 4

mobility:
  mode: synthetic

run:
  seed: 1001
  steps: 25
  scheduler_strategy: proportional_fair

matlab:
  engine: legacy_research
