# Research-path demo: San Francisco SoMa synthetic mobility + dual-band channel.
city:
  name: San Francisco
  preset: sfo_soma

radio:
  enabled_bands_ghz: [28.0, 39.0]
  beam_mode: codebook

scale:
  max_vehicles: 30
  max_base_stations: 4

mobility:
  mode: synthetic

run:
  seed: 1002
  steps: 25
  scheduler_strategy: proportional_fair

matlab:
  engine: legacy_research
