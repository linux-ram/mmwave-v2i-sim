[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmwave-v2i-sim"
version = "0.2.1"
description = "mmWave V2I link-layer simulator in Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ramanathan Subramanian", email = "subramanian.r@northeastern.edu" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.10",
  "matplotlib>=3.8",
]
gui = [
  "PySide6>=6.7",
  "matplotlib>=3.8",
]
osm = [
  "osmnx>=1.9",
]

[project.scripts]
mmwave-sim = "mmwave_v2i_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
