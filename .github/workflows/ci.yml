name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Guillotine parity binary (Linux)
        run: |
          c++ -std=c++17 -O2 vendor/RectangleBinPack/2drbp_parity.cpp \
            vendor/RectangleBinPack/GuillotineBinPack.cpp vendor/RectangleBinPack/Rect.cpp \
            -o vendor/RectangleBinPack/2drbp_parity
      - run: pip install -r requirements-lock.txt
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/generate_validation_report.py
      - run: test -f artifacts/validation/validation_report.json
